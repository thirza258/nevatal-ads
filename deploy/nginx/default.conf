# AdControl reverse proxy + dashboard static host (HTTP).
# In production, Cloudflare Tunnel terminates TLS at Cloudflare and forwards
# HTTP to this container over a loopback-only host port.
# See docs/operations.md for the tunnel configuration and HSTS guidance.

upstream adcontrol_api {
    server api:8088;
    keepalive 32;
}

# Cache policy is set at the server level so the security headers below stay
# inherited by every location. Locations that define their own add_header would
# discard server-level headers (nginx add_header inheritance rule).
#
# Document routes and the SPA fallback default to no-store. API, delivery, SDK,
# redirect, and SEO endpoints keep the Cache-Control generated by the API.
map $uri $adcontrol_cache_control {
    default "no-store";
    /sitemap.xml "";
    /robots.txt "";
    /healthz "";
    /readyz "";
    ~^/api/ "no-store";
    ~^/delivery/ "";
    ~^/click/ "";
    ~^/r/ "";
    ~^/sdk/ "";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    # Production hostname. Cloudflare Tunnel terminates TLS at Cloudflare and
    # forwards HTTP to this container; see docs/operations.md.
    server_name ads.nevatal.id;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 256k;
    client_body_timeout 15s;
    client_header_timeout 15s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com" always;
    add_header Cache-Control $adcontrol_cache_control always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Public delivery API and click redirects.
    location /delivery/ {
        proxy_pass http://adcontrol_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (do not append) so clients cannot spoof their rate-limit IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    location /click/ {
        proxy_pass http://adcontrol_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (do not append) so clients cannot spoof their rate-limit IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        # A location with add_header does not inherit server-level headers,
        # but a click response is a redirect, so only these two matter.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # First-party affiliate outbound redirect. Behaviour matches /click/ but the
    # API records a distinct outbound_redirect event and applies affiliate rules.
    location /r/ {
        proxy_pass http://adcontrol_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (do not append) so clients cannot spoof their rate-limit IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /sdk/ {
        proxy_pass http://adcontrol_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    location /api/ {
        proxy_pass http://adcontrol_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (do not append) so clients cannot spoof their rate-limit IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://adcontrol_api;
        proxy_set_header Host $host;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    location = /readyz {
        access_log off;
        proxy_pass http://adcontrol_api;
        proxy_set_header Host $host;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # Learning SEO documents are generated by the API so they only ever include
    # published, publicly visible courses and topics. Their Cache-Control is set
    # by the API (30 minutes) and is intentionally passed through.
    location = /sitemap.xml {
        proxy_pass http://adcontrol_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    location = /robots.txt {
        proxy_pass http://adcontrol_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # Hosted demo page (static, no inline scripts so the CSP above still applies).
    location /demo/ {
        alias /usr/share/nginx/demo/;
        index index.html;
        try_files $uri $uri/ /demo/index.html;
    }

    # Hashed Vite assets are immutable; index.html must never be cached.
    # Cache-Control is emitted by the map above.
    location /assets/ {
        try_files $uri =404;
    }

    location = /index.html {
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
